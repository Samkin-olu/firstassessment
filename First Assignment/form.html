
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form Page</title>
</head>
<body>

    <!-- Global Navigation -->
    <header>
        <nav aria-label="Global navigation">
            <a href="index.html">Home</a>
            <a href="form.html" aria-current="page">Sign Up</a>
        </nav>
    </header>

    <main>

            <!-- Sign-up and sign-in navigation -->
            <nav aria-label="Account options">
                <a href="#signup" aria-current="page">Sign Up</a>
                |
                <a href="">
                    Sign In
                </a>
            </nav>

            <section id="signup" aria-labelledby="signup-heading">
                <h2 id="signup-heading">Sign up</h2>
                <p>Create an account to get started on your learning journey</p>

                <form action="#" method="post">

                    <p>
                        <label for="email">Email Address</label><br>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="john.doe@example.com"
                            autocomplete="email"
                            required
                        >
                    </p>

                    <p>
                        <label for="first-name">First Name</label><br>
                        <input
                            type="text"
                            id="first-name"
                            name="firstName"
                            placeholder="John"
                            autocomplete="given-name"
                            required
                        >
                    </p>

                    <p>
                        <label for="last-name">Last Name</label><br>
                        <input
                            type="text"
                            id="last-name"
                            name="lastName"
                            placeholder="Doe"
                            autocomplete="family-name"
                            required
                        >
                    </p>
 <p>
                        <label for="phone-number">
                            Phone Number
                        </label><br>
                        <input
                            type=""
                            id=""
                            name="phone-number"
                            placeholder="+123456790"
                            autocomplete=""
                            minlength="8"
                            required
                        >
                    </p>

                    <p>
                        <label for="password">Password</label><br>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="********"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </p>


                    <p>
                        
                        <label for="terms">
                          By clicking Create account, I agree to Terms of Use and <br> 
                          acknowledge that I have read the Privacy Policy.
                        </label>
                    </p>

                    <button type="submit">Create Account</button>

                    <p>
                   OR
                </p>
                
                <button type="submit">Login with Google</button>
                </form>
            </section>
        </section>
    </main>

    <!-- Footer -->
     <footer>
        <address>
            Ejigbo Lagos, Nigeria
        </address>
        <p>&copy; 2026 Akinrinade Samuel. All rights reserved. </p>
    </footer>

</body>
</html>
